syntax = "proto3";

package kvstore;

// ---------------------------------------------------------------------------
// Client-facing API (exactly as specified in the lab handout)
// ---------------------------------------------------------------------------
enum ReadConsistency {
  LINEARIZABLE = 0;    // Must hit Leaseholder / Quorum
  FOLLOWER_STALE = 1;  // Served by local replica; bounded staleness
}

enum WriteStrategy {
  QUORUM_CP = 0;       // Requires majority (N/2 + 1) ACKs; fails if quorum lost
  ALWAYS_AP = 1;       // Accepts write on any available node; logs timestamp
}

message GetRequest {
  string key = 1;
  ReadConsistency consistency = 2;
  uint32 max_staleness_ms = 3;  // Used when consistency == FOLLOWER_STALE (0 = unbounded)
}

message GetReply {
  string value = 1;
  bool found = 2;
  uint64 read_timestamp = 3;    // write timestamp (microseconds) of the returned version
  bool is_stale = 4;            // true when served by a follower without a freshness guarantee
}

message PutRequest {
  string key = 1;
  string value = 2;
  string idempotency_key = 3;
  WriteStrategy strategy = 4;
  uint64 timestamp = 5;         // client timestamp in microseconds; 0 = server assigns
}

message PutReply {
  bool success = 1;
  uint32 acks_received = 2;
  string error_message = 3;
}

service KeyValueStore {
  rpc Get (GetRequest) returns (GetReply);
  rpc Put (PutRequest) returns (PutReply);
}

// ---------------------------------------------------------------------------
// Internal node-to-node + test-control API (extension, not used by clients)
// ---------------------------------------------------------------------------
message VersionedValue {
  string key = 1;
  string value = 2;
  uint64 timestamp = 3;
  string origin = 4;            // node that accepted the write (LWW tie-break)
}

message ReplicateRequest { string sender = 1; VersionedValue item = 2; }
message ReplicateReply   { bool applied = 1; }

message SyncRequest      { string sender = 1; repeated VersionedValue items = 2; }
message SyncReply        { repeated VersionedValue items = 1; }

message ReadLocalRequest { string sender = 1; string key = 2; }
message ReadLocalReply   { bool found = 1; VersionedValue item = 2; }

message PingRequest      { string sender = 1; }
message PingReply        { string name = 1; }

message PartitionRequest { repeated string blocked = 1; }  // peers this node cannot talk to
message PartitionReply   {}
message SyncNowRequest   {}
message SyncNowReply     { uint32 peers_synced = 1; }

service NodeControl {
  rpc Replicate    (ReplicateRequest) returns (ReplicateReply);
  rpc Sync         (SyncRequest)      returns (SyncReply);
  rpc ReadLocal    (ReadLocalRequest) returns (ReadLocalReply);
  rpc Ping         (PingRequest)      returns (PingReply);
  rpc SetPartition (PartitionRequest) returns (PartitionReply);
  rpc SyncNow      (SyncNowRequest)   returns (SyncNowReply);
}
